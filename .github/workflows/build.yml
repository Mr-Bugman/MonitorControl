name: Build MonitorControl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project MonitorControl.xcodeproj \
            -scheme MonitorControl \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log | grep -E "error|warning: |BUILD" | tail -40

      - name: Verify product
        run: |
          ls -d build/Build/Products/Release/MonitorControl.app
          codesign -dv build/Build/Products/Release/MonitorControl.app 2>&1 | head -5

      - name: Package artifact
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent MonitorControl.app MonitorControl.zip
          ls -lh MonitorControl.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorControl-${{ github.sha }}
          path: build/Build/Products/Release/MonitorControl.zip
          retention-days: 14
